name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch whisper.cpp (pinned to one commit)
        run: |
          mkdir -p app/src/main/cpp/whisper.cpp
          cd app/src/main/cpp/whisper.cpp
          git init -q
          git fetch -q --depth 1 https://github.com/ggml-org/whisper.cpp d1be6fde11ac6e0407606b4e42fe72d34add8037
          git checkout -q FETCH_HEAD
          rm -rf .git
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            MSG=$(grep -E "error:|What went wrong|FAILED|Could not|Execution failed|symbol:|location:" -A2 build.log | head -40 | tr '\n' '|' | cut -c1-1800)
            echo "::error title=Build failed::$MSG"
          fi
          exit $code
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "Keyboard-v$VER.apk"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "Keyboard-v$VER.apk" --clobber
            gh release edit "v$VER" --notes-file RELEASE_NOTES.md
          else
            gh release create "v$VER" "Keyboard-v$VER.apk" --target "$GITHUB_SHA" --title "Keyboard v$VER" --notes-file RELEASE_NOTES.md
          fi
